name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test scripts/validate-pages.checks.mjs
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - run: node scripts/validate-pages.mjs dist "$VITE_BASE_PATH"
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run build
      - run: node scripts/validate-pages.mjs dist /
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
