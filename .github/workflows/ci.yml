name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: root
            base: /
          - target: pages
            base: /Linear-Gragh-Explorer/
    env:
      VITE_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --version && npm --version
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm test
      - run: node --test scripts/validate-pages.checks.mjs
      - run: node scripts/validate-host-config.mjs && npm run build
        env:
          VITE_DEPLOY_TARGET: ${{ matrix.target }}
          VITE_LINEAR_CLIENT_ID: ci-fixture
          VITE_LINEAR_REDIRECT_URI: https://ci.example.test${{ matrix.base }}
      - run: node scripts/validate-pages.mjs dist "$VITE_BASE_PATH"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          E2E_CALLBACK_URL: https://ci.example.test${{ matrix.base }}
